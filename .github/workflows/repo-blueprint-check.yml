name: Repository Blueprint Check (reusable)

# Called from another repo's workflow like:
#
#   jobs:
#     blueprint:
#       uses: shata-solutions/engineering-os-tools/.github/workflows/repo-blueprint-check.yml@v1
#
# No secrets required. This repo is public, so the calling repo's default
# GITHUB_TOKEN is sufficient to check it out — there is nothing to configure beyond
# the `uses:` line above. Pin `@v1` for a maintained moving major version, `@v1.0.0`
# (or any other exact tag) for a fully stable version, or a commit SHA for maximum
# supply-chain immutability.
#
# PINNING MECHANISM (read this before bumping the version below): GitHub Actions does
# NOT expose a reliable way for a reusable workflow to introspect which ref *it itself*
# was called at from within its own job steps — `github.workflow_ref` reports the
# TOP-LEVEL calling workflow's own ref (e.g. the caller's own branch), not this
# workflow's. An earlier version of this file tried to parse that value and used it to
# check out the scripts — which silently checked out whatever branch the CALLER
# happened to be on instead of the pinned tag/SHA, defeating the entire point of
# pinning. Do not reintroduce that pattern.
#
# The correct, reliable mechanism: GitHub already fetches THIS YAML FILE at exactly
# the ref the caller pinned to (that's the built-in guarantee `uses: ...@<ref>` gives
# for the workflow definition itself). So this file hardcodes its OWN release tag
# below, and lets that self-reference carry the pin through to the script checkout.
# At every release, this line is updated to the new tag as part of cutting the
# release, BEFORE the commit is tagged — see RELEASING.md.
env:
  ENGINEERING_OS_TOOLS_REF: v1.0.4 # <- update this to the new tag when cutting a release

on:
  workflow_call: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Checkout engineering-os-tools (scripts source of truth) at this release's own tag
        uses: actions/checkout@v4
        with:
          repository: shata-solutions/engineering-os-tools
          ref: ${{ env.ENGINEERING_OS_TOOLS_REF }}
          path: .engineering-os-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run blueprint check
        run: node .engineering-os-tools/scripts/check-repo-blueprint.mjs .

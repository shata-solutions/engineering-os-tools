name: Engineering Score (reusable)

# Called from another repo's workflow like:
#
#   jobs:
#     score:
#       uses: shata-solutions/engineering-os-tools/.github/workflows/engineering-score.yml@v1
#
# No secrets required — see repo-blueprint-check.yml's header comment for the full
# explanation, including the PINNING MECHANISM note (why this hardcodes its own tag
# below instead of trying to introspect it — the introspection approach is broken and
# must not be reintroduced; see that file for the full story).
#
# This workflow reports a score; it does not fail the build. It's informational, run
# on push/PR or on demand, not as a merge gate — pair it with a real human review for
# anything it can't see (architecture quality, code quality, performance, scalability,
# visual consistency, engineering maturity).
env:
  ENGINEERING_OS_TOOLS_REF: v1.0.4 # <- update this to the new tag when cutting a release

on:
  workflow_call: {}

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Checkout engineering-os-tools (scripts source of truth) at this release's own tag
        uses: actions/checkout@v4
        with:
          repository: shata-solutions/engineering-os-tools
          ref: ${{ env.ENGINEERING_OS_TOOLS_REF }}
          path: .engineering-os-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run engineering score
        run: node .engineering-os-tools/scripts/engineering-score.mjs .
